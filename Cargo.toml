[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# No debug info in dev builds: keeps target/ small (the disk is nearly full).
[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
