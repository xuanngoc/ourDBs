# Build the universal OurDB.dmg (Apple Silicon + Intel).
# - Push a tag like v0.1.0: the DMG is attached to a GitHub Release for that tag.
# - Run the workflow by hand: the DMG is only kept as a build artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build OurDB.app and OurDB.dmg
        run: ./scripts/bundle-macos.sh --universal --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OurDB-dmg
          path: dist/OurDB.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **OurDB.dmg** below and open it.
          2. Drag **OurDB** to **Applications**.
          3. Open OurDB. The first time, macOS blocks it because it is not notarized by Apple:
             click **Done**, open **System Settings → Privacy & Security**, and click **Open Anyway** next to "OurDB was blocked".

          Works on Apple Silicon and Intel Macs, macOS 11 or later.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/OurDB.dmg \
            --title "OurDB $GITHUB_REF_NAME" --notes-file notes.md
