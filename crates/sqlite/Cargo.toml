[package]
name = "ourdb-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
ourdb-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
