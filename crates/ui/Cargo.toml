[package]
name = "ourdb-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
keyring = "4.2.0"
ourdb-core = { version = "0.1.0", path = "../core" }
png = "0.18"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.92"
