[package]
name = "ourdb-mongo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
bson = { version = "3.1.0", features = ["serde_json-1"] }
futures-util = "0.3.34"
json5 = "1.3.8"
mongodb = { version = "3.10.2", features = ["bson-3", "compat-3-3-0", "dns-resolver", "rustls-tls"], default-features = false }
ourdb-core = { version = "0.1.0", path = "../core" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
